[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-eda"
version = "0.1.0"
description = "Correlation, covariance, and exploratory data analysis for the trade-suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["trading", "correlation", "covariance", "eda", "finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trade-eda = "trade_eda.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/trade-eda"
Repository = "https://github.com/crieck2010/trade-eda"

[tool.setuptools.packages.find]
where = ["src"]
